application:
  url: "https://forms.gle/LePeVjKyiseWoMfo6"
  label: "PIER Lab Application Form"

positions:
  - title: "Postdoctoral Researcher"
    description: "Lead research on physical intelligence and embodied robotics, from problem formulation and algorithm development to experiments on real humanoid and manipulation platforms. Postdoctoral researchers are expected to develop an independent research direction while collaborating with students and lab members."
    requirements:
      - "Ph.D. in robotics, mechanical engineering, electrical engineering, computer science, or a related field"
      - "Research experience in robot control, robot learning, manipulation, humanoids, or a closely related area"
      - "Strong publication, implementation, and technical communication record"
      - "Ability to lead projects and conduct experiments on real robotic systems"
    open: true

  - title: "M.S. Student"
    description: "M.S. students develop a focused research project in whole-body robot control, visuomotor policy learning, imitation learning, teleoperation, or contact-rich manipulation. Projects combine algorithm development with validation on PIER Lab's real robotic platforms."
    requirements:
      - "B.S. degree in mechanical engineering, electrical engineering, computer science, robotics, or a related field"
      - "Proficiency in Python and/or C++; experience with ROS/ROS2, PyTorch, or control frameworks is a plus"
      - "Strong interest in embodied AI and hands-on real-robot research"
      - "Eligibility for a KIST-affiliated graduate program"
    open: true

  - title: "Research Intern"
    description: "Research interns join an active lab project and gain hands-on experience with real robotic systems. Work may include robot control, teleoperation, data collection, hardware integration, simulation, and learning-based manipulation."
    requirements:
      - "Current student or recent graduate in engineering, computer science, robotics, or a related field"
      - "Basic programming ability in Python and/or C++"
      - "Availability for a sustained research period specified in the application form"
      - "Initiative, careful documentation, and willingness to work with real hardware"
    open: true

  - title: "University Field-Placement / Co-op Student"
    description: "Field-placement students participate through an official university co-op or field-training program. Students work on a defined engineering task while learning the lab's development workflow, safety practices, and real-robot experimentation process."
    requirements:
      - "Enrollment in a university program that recognizes field placement, co-op, or academic-credit training"
      - "Relevant coursework or project experience in robotics, software, electronics, or mechanical systems"
      - "Ability to participate for the full placement period required by the university and KIST"
      - "Basic Python and/or C++ skills and a responsible approach to laboratory work"
    open: true
