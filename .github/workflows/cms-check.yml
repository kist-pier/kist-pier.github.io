name: Check CMS

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "assets/js/cms-admin.js"
      - "supabase/**"
      - ".github/workflows/cms-check.yml"
  pull_request:
    paths:
      - "admin/**"
      - "assets/js/cms-admin.js"
      - "supabase/**"
      - ".github/workflows/cms-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check browser JavaScript
        run: node --check assets/js/cms-admin.js
      - name: Check Edge Function
        run: deno check --config supabase/functions/deno.json supabase/functions/cms-content/index.ts
      - name: Check formatting
        run: deno fmt --check supabase/functions/cms-content/index.ts supabase/functions/deno.json supabase/config.toml
