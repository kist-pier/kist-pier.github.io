name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1,3,5" # Monday, Wednesday, Friday at 09:00 KST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install citation dependencies
        run: pip install scholarly==1.7.11 bibtexparser==1.4.4 PyYAML==6.0.3
      - name: Update existing publication citation counts
        run: timeout 180 python bin/update_scholar_citations.py
      - name: Commit updated cache
        run: |
          git add _data/citations.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Google Scholar citation counts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN pushes do not trigger the push-based Pages workflow.
      # Dispatch after every successful refresh so a previous failed deployment can recover.
      - name: Deploy refreshed citations
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
